<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>IT Helpdesk - Submit Ticket</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            color: #222;
        }

        header {
            background: #1f2937;
            color: white;
            padding: 20px;
            text-align: center;
        }

        header h1 {
            margin-bottom: 8px;
        }

        .container {
            width: 90%;
            max-width: 700px;
            margin: 35px auto;
        }

        .card {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
        }

        h2 {
            margin-bottom: 25px;
            color: #1f2937;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 7px;
            font-size: 15px;
        }

        input:focus,
        select:focus,
        textarea:focus {
            outline: none;
            border-color: #2563eb;
        }

        textarea {
            height: 120px;
            resize: vertical;
        }

        button {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 7px;
            background: #2563eb;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        button:disabled {
            background: #93c5fd;
            cursor: not-allowed;
        }

        .message {
            margin-top: 20px;
            padding: 15px;
            border-radius: 7px;
            display: none;
            line-height: 1.6;
        }

        .success {
            background: #dcfce7;
            color: #166534;
        }

        .error {
            background: #fee2e2;
            color: #991b1b;
        }

        .message a {
            color: inherit;
            font-weight: bold;
        }

        .links {
            text-align: center;
            margin-top: 20px;
        }

        .links a {
            color: #2563eb;
            text-decoration: none;
            font-weight: bold;
            margin: 0 8px;
        }

        .links a:hover {
            text-decoration: underline;
        }

        @media (max-width: 600px) {
            .container {
                width: 95%;
            }

            .card {
                padding: 20px;
            }
        }
    </style>
</head>

<body>

    <header>
        <h1>🛠️ IT Helpdesk</h1>
        <p>Employee Support Ticket Portal</p>
    </header>

    <div class="container">

        <div class="card">

            <h2>🎫 Submit Support Ticket</h2>

            <form id="ticketForm">

                <div class="form-group">
                    <label for="employeeName">Employee Name</label>

                    <input
                        type="text"
                        id="employeeName"
                        placeholder="Enter your name"
                        required>
                </div>

                <div class="form-group">
                    <label for="email">Email Address</label>

                    <input
                        type="email"
                        id="email"
                        placeholder="Enter your email"
                        required>
                </div>

                <div class="form-group">
                    <label for="department">Department</label>

                    <select id="department" required>

                        <option value="">
                            Select Department
                        </option>

                        <option value="IT">IT</option>
                        <option value="HR">HR</option>
                        <option value="Finance">Finance</option>
                        <option value="Sales">Sales</option>
                        <option value="Operations">Operations</option>

                    </select>
                </div>

                <div class="form-group">
                    <label for="category">Issue Category</label>

                    <select id="category" required>

                        <option value="">
                            Select Category
                        </option>

                        <option value="Hardware">Hardware</option>
                        <option value="Software">Software</option>
                        <option value="Network">Network</option>
                        <option value="Access">Access</option>
                        <option value="Other">Other</option>

                    </select>
                </div>

                <div class="form-group">
                    <label for="priority">Priority</label>

                    <select id="priority" required>

                        <option value="">
                            Select Priority
                        </option>

                        <option value="Low">Low</option>
                        <option value="Medium">Medium</option>
                        <option value="High">High</option>

                    </select>
                </div>

                <div class="form-group">
                    <label for="description">
                        Issue Description
                    </label>

                    <textarea
                        id="description"
                        placeholder="Describe your issue..."
                        required></textarea>
                </div>

                <button
                    type="submit"
                    id="submitButton">
                    Submit Ticket
                </button>

            </form>

            <div
                id="message"
                class="message">
            </div>

            <!-- Navigation Links -->

            <div class="links">

                <a href="/frontend/track.html">
                    🔍 Track Ticket
                </a>

                |

                <a href="/frontend/login.html">
                    👤 Admin Login
                </a>

            </div>

        </div>

    </div>

    <script>

        const API_URL =
            "https://q4ahc74dci.execute-api.ap-south-1.amazonaws.com/tickets";


        const form =
            document.getElementById("ticketForm");

        const messageBox =
            document.getElementById("message");

        const submitButton =
            document.getElementById("submitButton");


        form.addEventListener(
            "submit",
            async function (event) {

                event.preventDefault();

                messageBox.style.display = "none";

                submitButton.disabled = true;

                submitButton.textContent =
                    "Submitting Ticket...";


                const ticketData = {

                    employeeName:
                        document
                            .getElementById("employeeName")
                            .value
                            .trim(),

                    email:
                        document
                            .getElementById("email")
                            .value
                            .trim(),

                    department:
                        document
                            .getElementById("department")
                            .value,

                    category:
                        document
                            .getElementById("category")
                            .value,

                    priority:
                        document
                            .getElementById("priority")
                            .value,

                    description:
                        document
                            .getElementById("description")
                            .value
                            .trim()
                };


                console.log(
                    "Sending ticket:",
                    ticketData
                );


                try {

                    const response =
                        await fetch(API_URL, {

                            method: "POST",

                            headers: {
                                "Content-Type":
                                    "application/json"
                            },

                            body:
                                JSON.stringify(
                                    ticketData
                                )
                        });


                    const data =
                        await response.json();


                    console.log(
                        "POST RESPONSE:",
                        data
                    );


                    if (!response.ok) {

                        throw new Error(
                            data.message ||
                            "Unable to create ticket"
                        );
                    }


                    const ticket =
                        data.ticket || data;


                    const ticketId =
                        ticket.ticketId ||
                        data.ticketId;


                    messageBox.className =
                        "message success";

                    messageBox.style.display =
                        "block";


                    messageBox.innerHTML = `
                        <strong>
                            ✅ Ticket submitted successfully!
                        </strong>

                        <br><br>

                        Your Ticket ID is:

                        <strong>
                            ${ticketId}
                        </strong>

                        <br><br>

                        Please save this Ticket ID
                        to track your ticket.

                        <br><br>

                        <a href="/frontend/track.html">
                            🔍 Track Your Ticket
                        </a>
                    `;


                    form.reset();

                } catch (error) {

                    console.error(
                        "SUBMIT ERROR:",
                        error
                    );


                    messageBox.className =
                        "message error";

                    messageBox.style.display =
                        "block";


                    messageBox.innerHTML =
                        "❌ " + error.message;

                } finally {

                    submitButton.disabled =
                        false;

                    submitButton.textContent =
                        "Submit Ticket";
                }

            }
        );

    </script>

</body>

</html>
